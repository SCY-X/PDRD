  STUDENT_PRETRAIN_PATH: ''

FITNET:
  HINT_LAYER: 3
  INPUT_SIZE: (320, 160)
  KD_WEIGHT: 10.0


INPUT:
  SIZE_TRAIN: [320, 160]
  SIZE_TEST: [320, 160]
  PADDING: 12
  RE_PROB: 0.5

