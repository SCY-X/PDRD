EXPERIMENT:
  DEVICE_ID: "'1'"
  CUDA_AMP: True

OUTPUT_DIR:
  ROOT_PATH: "./log_IR"
  EXPERIMENT_NAME: "DukeMTMC_reID_FitNet_ResNet101_ResNet18_320x160_10"


DATASETS:
  NAMES: "DukeMTMC_reID"
  ROOT_DIR: "/home/data2/xieyi/data"


DISTILLER:
  TYPE: "FitNet"
  TEACHER_NAME: "ResNet101"
  TEACHER_PROJECTION_DIM: 512
  TEACHER_MODEL_PATH: "./IR_Distiller/download_ckpts/DukeMTMC_reID_Teachers/DukeMTMC_reID_ResNet101_320x160_79.86_89.23.pth"
  STUDENT_NAME: "ResNet18"
