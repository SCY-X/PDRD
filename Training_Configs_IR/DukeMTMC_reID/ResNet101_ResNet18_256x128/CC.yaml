EXPERIMENT:
  DEVICE_ID: "'1'"
  CUDA_AMP: True

OUTPUT_DIR:
  ROOT_PATH: "./log_IR"
  EXPERIMENT_NAME: "DukeMTMC_reID_CC_ResNet101_ResNet18_256x128_10"


DATASETS:
  NAMES: "DukeMTMC_reID"
  ROOT_DIR: "/home/data2/xieyi/data"


DISTILLER:
  TYPE: "CC"
  TEACHER_NAME: "ResNet101"
  TEACHER_PROJECTION_DIM: 512
  TEACHER_MODEL_PATH: "./IR_Distiller/download_ckpts/DukeMTMC_reID_Teachers/DukeMTMC_reID_ResNet101_256x128_78.29_88.38.pth"
  STUDENT_NAME: "ResNet18"
  STUDENT_PROJECTION_DIM: 128
  STUDENT_PRETRAIN_PATH: ''

CC:
  T_DIM: 2048
  S_DIM: 512
  NORMALIZE: True
  KD_WEIGHT: 10.0

INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PADDING: 10
  RE_PROB: 0.5

DATALOADER:
  NUM_WORKERS: 8
  NUM_INSTANCE: 6


SOLVER:
  TRAINER: "kd"
  IMS_PER_BATCH: 96
  IMS_DISTILLATION_PER_BATCH: 96
  MAX_EPOCHS: 150
  BASE_LR: 0.02
  LR_DECAY_TYPE: "WarmupCosineAnnealingLR" #"WarmupMultiStepLR"  #WarmupCosineAnnealingLR
  LR_WARMUP_EPOCHS: 10
  LR_WARMUP_FACTOR: 0.1
  LR_DECAY_STEPS: [60] #[30, 60, 90] #[30, 60, 90]
  OPTIMIZER_NAME: "SGD"

  CHECKPOINT_PERIOD: 150


TEST:
  IMS_PER_BATCH: 512
  WEIGHT: 150

