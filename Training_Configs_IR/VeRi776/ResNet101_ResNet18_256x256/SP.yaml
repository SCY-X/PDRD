EXPERIMENT:
  DEVICE_ID: "'1'"
  CUDA_AMP: True

OUTPUT_DIR:
  ROOT_PATH: "./log_IR"
  EXPERIMENT_NAME: "VeRi776_SP_ResNet101_ResNet18_256x256_1000"


DATASETS:
  NAMES: "VeRi776"
  ROOT_DIR: "/home/data2/xieyi/data"


DISTILLER:
  TYPE: "SP"
  TEACHER_NAME: "ResNet101"
  TEACHER_PROJECTION_DIM: 512
  TEACHER_MODEL_PATH: "./IR_Distiller/download_ckpts/VeRi776_Teachers/VeRi776_ResNet101_256x256_80.12_96.01.pth"
